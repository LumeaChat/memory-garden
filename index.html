<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#194b42"><title>Memory Garden 3D</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#387d70,#123b36 75%);color:#fff4d9;font:16px system-ui;min-height:100dvh}main{max-width:520px;margin:auto;padding:18px 16px 28px}h1{font:normal 34px Georgia;text-align:center;margin:4px 0}header p{text-align:center;color:#cce1c8;font-size:13px;margin:6px 0 14px}canvas{width:100%;display:block;aspect-ratio:2.1;border-radius:19px;box-shadow:0 8px 25px #092c2866;background:#b4e5d2}.stats{display:flex;gap:8px;margin:13px 0}.stat{flex:1;text-align:center;background:#ffffff0c;border:1px solid #ffffff20;border-radius:12px;padding:8px}.stat small{display:block;font-size:10px;letter-spacing:1px;color:#cde1c8}.stat strong{font-size:23px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;position:relative}.tile{border:0;padding:0;background:none;aspect-ratio:1.1;cursor:pointer;perspective:600px;position:relative;-webkit-tap-highlight-color:transparent}.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .42s}.open .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:13px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(24px,8vw,40px);border:1px solid #ffffff66;box-shadow:0 5px 0 #133e32,0 8px 8px #082c2755,inset 0 3px 2px #ffffff50}.back{background:linear-gradient(145deg,#94caa3,#37836b);color:#f0e4ac}.front{transform:rotateY(180deg);background:linear-gradient(145deg,#fffdf1,#f1dfb9);box-shadow:0 5px 0 #b5a477}.found .front{background:linear-gradient(145deg,#edffda,#a8dcae)}.tile:disabled{cursor:default}.msg{text-align:center;min-height:48px;padding:14px 0 8px;font-size:14px}.controls{display:flex;gap:8px}.controls button,#next{flex:1;padding:12px 5px;border-radius:11px;background:#ffffff12;color:#fff3d6;border:1px solid #ffffff35;font:600 13px system-ui;cursor:pointer}.controls button:disabled{opacity:.45}#next{width:100%;background:#f4d99c;color:#254d40;margin:8px 0 14px}footer{text-align:center;font-size:10px;letter-spacing:1.4px;color:#a5c7b1;margin:20px 0}[hidden]{display:none!important}.spark{position:absolute;pointer-events:none;z-index:10;width:9px;height:9px;border-radius:50%;animation:burst .7s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main><header><h1>Memory Garden 3D</h1><p>Find a pair. Grow a little wonder.</p></header><canvas id="garden" width="720" height="344" aria-label="A miniature garden growing with every match"></canvas><div class="stats"><div class="stat"><small>GARDEN</small><strong id="level"></strong></div><div class="stat"><small>PAIRS</small><strong id="pairs"></strong></div><div class="stat"><small>MOVES</small><strong id="moves"></strong></div></div><div class="board" id="board"></div><div id="msg" class="msg" aria-live="polite">Find two matching treasures.</div><button id="next" hidden>Explore the next garden →</button><div class="controls"><button id="peek">Peek (2)</button><button id="restart">Restart garden</button><button id="sound">Sound off</button></div><footer>NO ADS · NO TIMER · JUST ENJOY</footer></main><script>
const $=id=>document.getElementById(id),icons=['🌷','🦋','🌻','🍓','🐞','🌈','🪻','🐝','🍒','🌺'],names=['Tulip','Butterfly','Sunflower','Strawberry','Ladybird','Rainbow','Lavender','Bee','Cherries','Hibiscus'];let level=1,deck=[],found=[],moves=0,peeks=0,opened=[],busy=false,preview=false,epoch=0,sound=false,ac;
function save(){try{localStorage.setItem('memory-garden-v1',JSON.stringify({level,deck,found,moves,peeks,sound}))}catch(e){}}
function restore(){try{let s=JSON.parse(localStorage.getItem('memory-garden-v1'));if(!s||!Number.isInteger(s.level)||s.level<1||!Array.isArray(s.deck)||!Array.isArray(s.found)||s.deck.length!==2*Math.min(10,6+Math.floor((s.level-1)/2)))return false;({level,deck,found,moves,peeks,sound}=s);return true}catch(e){return false}}
function start(l){epoch++;level=l;let n=Math.min(10,6+Math.floor((l-1)/2));deck=Array.from({length:2*n},(_,i)=>i%n);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}found=[];moves=0;peeks=0;opened=[];busy=false;preview=false;$('msg').textContent='Find two matching treasures.';build();save()}
function build(){$('board').replaceChildren();deck.forEach((v,i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<span class="inner"><span class="face back" aria-hidden="true">✿</span><span class="face front" aria-hidden="true">'+icons[v]+'</span></span>';b.onclick=()=>choose(i);$('board').append(b)});render()}
function render(){Array.from($('board').children).filter(x=>x.classList.contains('tile')).forEach((b,i)=>{let f=found.includes(i),v=preview||opened.includes(i)||f;b.classList.toggle('open',v);b.classList.toggle('found',f);b.disabled=busy||f||opened.includes(i);b.setAttribute('aria-label',v?names[deck[i]]:'Hidden card '+(i+1))});$('level').textContent=level;$('pairs').textContent=found.length/2+'/'+deck.length/2;$('moves').textContent=moves;$('peek').disabled=busy||opened.length>0||peeks>=2||found.length===deck.length;$('peek').textContent='Peek ('+(2-peeks)+')';$('next').hidden=found.length!==deck.length;$('sound').textContent=sound?'Sound on':'Sound off'}
function tone(){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();[523,659,784].forEach((f,i)=>{let t=ac.currentTime+i*.08,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.3)})}catch(e){}}
function burst(i){let b=$('board').children[i];for(let j=0;j<12;j++){let p=document.createElement('i');p.className='spark';p.style.cssText='left:'+(b.offsetLeft+b.offsetWidth/2)+'px;top:'+(b.offsetTop+b.offsetHeight/2)+'px;background:'+['#ff9bc2','#ffe6a0','#a6e9ff','#bfa8ff'][j%4]+';--x:'+Math.cos(j*.524)*65+'px;--y:'+Math.sin(j*.524)*65+'px';$('board').append(p);setTimeout(()=>p.remove(),800)}}
function choose(i){if(busy||found.includes(i)||opened.includes(i))return;opened.push(i);if(opened.length===1){$('msg').textContent='Can you remember its partner?';render();return}moves++;busy=true;render();let [a,b]=opened,match=deck[a]===deck[b],e=epoch;if(match)tone();setTimeout(()=>{if(e!==epoch)return;if(match){found.push(a,b);$('msg').textContent='A beautiful match! Your garden grows.'}else $('msg').textContent='Try another pair. There is no rush.';opened=[];busy=false;render();save();if(match){burst(a);burst(b)}if(found.length===deck.length)$('msg').textContent='Your garden is blooming! '+moves+' moves.'},match?530:1300)}
$('peek').onclick=()=>{if(busy||opened.length||peeks>=2)return;peeks++;preview=true;busy=true;let e=epoch;render();save();$('msg').textContent='Look closely…';setTimeout(()=>{if(e!==epoch)return;preview=false;busy=false;render();$('msg').textContent='Ready when you are.'},3500)};$('restart').onclick=()=>{if(moves===0||confirm('Start this garden again?'))start(level)};$('next').onclick=()=>start(level+1);$('sound').onclick=()=>{sound=!sound;save();render();if(sound)tone()};if(restore()){build();$('msg').textContent=found.length===deck.length?'Your garden is blooming!':'Welcome back to your garden.'}else start(1);
const c=$('garden'),g=c.getContext('2d'),W=c.width,H=c.height,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,palettes=[['#b5e6d5','#f9e5ae','#77bc78'],['#c9d8ff','#f8c8e4','#8ebc89'],['#b5e4f4','#fff0c6','#9fc677']],spots=[[-2.8,-1.5],[2.5,-1.4],[-3,0],[3,.3],[-2.2,1.3],[2,1.6],[-.9,-2],[.9,-2],[-3.3,-.5],[3.3,-.6]];
function P(x,y,z){return [360+(x-z*.65)*64,171+(z+x*.23)*24-y*53]}function poly(points,fill){g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=fill;g.fill()}function ellipse(x,y,rx,ry,fill){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=fill;g.fill()}function ball(x,y,r,color){let a=g.createRadialGradient(x-r*.35,y-r*.45,0,x,y,r);a.addColorStop(0,'#fff7ce');a.addColorStop(.45,color);a.addColorStop(1,color);ellipse(x,y,r,r,a)}function line(a,b,color,w){g.beginPath();g.moveTo(...a);g.lineTo(...b);g.strokeStyle=color;g.lineWidth=w;g.lineCap='round';g.stroke()}
function draw(t){const p=palettes[(level-1)%3];let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,p[0]);sky.addColorStop(1,p[1]);g.fillStyle=sky;g.fillRect(0,0,W,H);ellipse(590,57,32,32,'#fff3bd');for(let i=0;i<3;i++){let x=110+i*230;ellipse(x,45+i%2*18,48,13,'#ffffff66');ellipse(x+27,38+i%2*18,24,15,'#ffffff66')}let a=P(-3.8,0,-2.5),b=P(3.8,0,-2.5),d=P(3.8,0,2.5),e=P(-3.8,0,2.5);ellipse(360,254,288,44,'#264c4430');poly([e,d,P(3.8,-.55,2.5),P(-3.8,-.55,2.5)],'#825d48');poly([b,d,P(3.8,-.55,2.5),P(3.8,-.55,-2.5)],'#664b3e');poly([a,b,d,e],p[2]);poly([P(-.55,.01,-2.5),P(.55,.01,-2.5),P(1.1,.01,2.5),P(-.1,.01,2.5)],'#f1d49a');let pond=P(-.35,.03,.25);ellipse(...pond,74,34,'#397f83');ellipse(pond[0],pond[1]-4,68,29,'#54cbd2');for(let i=0;i<3;i++){let phase=reduce?0:Math.sin(t/600+i)*7;ellipse(pond[0]-25+i*26+phase,pond[1]-6+i*5,12,1.5,'#e1fff0aa')}let plants=spots.slice(0,found.length/2).map((q,i)=>({q,i})).sort((a,b)=>a.q[1]-b.q[1]);for(let {q:[x,z],i} of plants){let base=P(x,0,z),top=P(x,.77+(i%3)*.12,z);ellipse(base[0],base[1],19,6,'#285c3d44');line(base,top,'#387a43',5);ellipse(base[0]-10,base[1]-18,13,5,'#499d52');ellipse(base[0]+9,base[1]-28,12,5,'#6cbb5d');let colors=['#f46d9b','#ffca57','#b78aeb','#f79157','#e86db8','#6ad9e3'];for(let j=0;j<5;j++){let a=j*Math.PI*2/5;ball(top[0]+Math.cos(a)*12,top[1]+Math.sin(a)*10,9,colors[i%6])}ball(top[0],top[1],7,'#ffd35c')}if(found.length){let x=360+(reduce?0:Math.sin(t/1300)*95),y=85+(reduce?0:Math.cos(t/780)*12),wing=reduce?9:5+Math.abs(Math.sin(t/120))*10;ellipse(x-wing,y,wing,8,'#b779dd');ellipse(x+wing,y,wing,8,'#ee91c2');line([x,y-5],[x,y+6],'#76566e',2)}requestAnimationFrame(draw)}requestAnimationFrame(draw);if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
